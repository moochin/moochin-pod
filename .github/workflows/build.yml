name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Unit tests (protocol)
        run: pio test -e native
      - name: Build Dial firmware
        run: pio run -e dial
      - uses: actions/upload-artifact@v4
        with:
          name: podhub-firmware
          path: |
            .pio/build/dial/podhub-factory.bin
            .pio/build/dial/firmware.bin
