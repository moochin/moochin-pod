; Pod Hub firmware. PlatformIO is for development only: end users install
; with the browser installer (see README.md).

[platformio]
default_envs = dial

[env:dial]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = default_8MB.csv
lib_deps =
  m5stack/M5Unified@0.2.2
  h2zero/NimBLE-Arduino@2.1.2
  ESP32Async/AsyncTCP@3.5.0
  ESP32Async/ESPAsyncWebServer@3.12.0
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=3
  ; USB-C serial for logs without an extra UART adapter
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; NimBLE: central only, room for more pods than we expect
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=8
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
  ; Web server on core 1 with the UI; BLE stays on core 0
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
  -DCONFIG_ASYNC_TCP_STACK_SIZE=6144
build_unflags = -std=gnu++11
extra_scripts = post:scripts/merge_bin.py

; Host-side unit tests: `pio test -e native`
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<pods/blazepod_protocol.cpp>
build_flags = -std=c++17 -Wall -Wextra -Isrc
